<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Iron Path</title>
  </head>
  <body style="margin: 0; background: #0d1117; color: #e6edf3; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background: #0d1117;">
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px; background: #161b22; border: 1px solid #30363d; border-radius: 12px;">
            <tr>
              <td style="padding: 32px;">
                <p style="margin: 0 0 20px; color: #d7a449; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">Iron Path</p>
                <h1 style="margin: 0 0 16px; color: #f0f6fc; font-size: 26px; line-height: 1.25;">Sign in to Iron Path</h1>
                <p style="margin: 0 0 24px; color: #b1bac4; font-size: 16px; line-height: 1.6;">Use the secure link below to open your dashboard. This link can only be used once.</p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="border-radius: 8px; background: #d7a449;">
                      <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 13px 22px; color: #111418; font-size: 16px; font-weight: 700; text-decoration: none;">Open Iron Path</a>
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 8px; color: #8b949e; font-size: 13px; line-height: 1.5;">If the button does not work, copy and paste this link into your browser:</p>
                <p style="margin: 0; font-size: 13px; line-height: 1.5; word-break: break-all;"><a href="{{ .ConfirmationURL }}" style="color: #e3b85f;">{{ .ConfirmationURL }}</a></p>
                <p style="margin: 24px 0 0; color: #8b949e; font-size: 13px; line-height: 1.5;">If you did not request this email, you can safely ignore it.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
